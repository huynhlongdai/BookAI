[project]
name = "bookai"
version = "0.1.0"
description = "AI-powered book to affiliate marketing content pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bilonglo9x" }]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "ebooklib>=0.18",
    "html2text>=2024.2",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "openai-whisper>=20230918",
    "edge-tts>=6.1",
    # Phase 1 video engine upgrade (inspired by MoneyPrinterTurbo)
    "moviepy>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "openai",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
redis = [
    "redis>=5.0",
]
all-tts = [
    "edge-tts>=6.1",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
bookai = "bookai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
