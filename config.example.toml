# BookAI Configuration
# Copy to config.toml and fill in your API keys

[app]
project_name = "BookAI"
version = "0.2.0"
listen_host = "0.0.0.0"
listen_port = 8080
log_level = "INFO"
output_dir = "output"
max_concurrent_tasks = 5
max_queued_tasks = 100
enable_redis = false
redis_host = "localhost"
redis_port = 6379

[llm]
provider = "openai"  # openai, anthropic, gemini, deepseek, ollama, groq, litellm
openai_api_key = ""
openai_base_url = "https://api.openai.com/v1"
openai_model_name = "gpt-4o-mini"
temperature = 0.7
max_tokens = 4096

[tts]
provider = "edge_tts"  # edge_tts, azure, siliconflow, elevenlabs, no_voice
voice = "vi-VN-HoaiMyNeural"
rate = "+0%"
azure_speech_key = ""
azure_speech_region = ""

[video]
aspect = "9:16"  # 9:16, 16:9, 1:1
transition = "fade_in"
bgm_mode = "random"  # none, random, specific
subtitle_enabled = true
subtitle_template = ""  # classic, capcut_white_box, capcut_dark_box, neon_glow, bold_impact, etc.
video_source = "pexels"
pexels_api_keys = []       # Get free key: https://www.pexels.com/api/
pixabay_api_keys = []      # Get free key: https://pixabay.com/api/docs/
coverr_api_key = ""

# Hook/Title/Outro sections
hook_style = ""           # bold_question, shocking_fact, book_rating, quote_reveal, mystery
hook_text = ""
title_card_style = ""     # book_cover, minimalist, gradient_card, split_screen
outro_style = ""          # subscribe_cta, rating_summary, next_book
outro_text = "Cảm ơn đã xem!"

[material]
# Keyword generation from script
keyword_mode = "llm"       # "llm" (AI-powered) or "regex" (no API needed)
match_script_order = true  # Keywords follow script chronology

# Local material directory
local_dir = ""             # Path to local video/image materials folder
local_mode = "supplement"  # "only", "supplement" (stock + local), "priority" (local first)
scan_recursive = true

# Folder structure suggestion:
# materials/
# ├── hooks/         # Hook video clips
# ├── backgrounds/   # Background footage
# ├── book_covers/   # Book cover images
# ├── overlays/      # Text overlays
# ├── intros/        # Intro clips
# └── outros/        # Outro clips

# Google Drive material source
[material.drive]
api_key = ""               # Google API key (for private folders)
# folders = [
#     {name = "Book Covers", url = "https://drive.google.com/drive/folders/..."},
#     {name = "Backgrounds", url = "https://drive.google.com/drive/folders/..."},
# ]

# Dynamic text effects (CapCut Phase 2)
[effects]
glow_preset = ""           # neon_pulse, neon_flicker, soft_glow, fire_glow, rainbow_cycle, gradient_sweep, shadow_pop, frost_shine
overlay_type = ""          # lower_third, full_screen_quote, bullet_list, chapter_marker, highlight_box, stats_counter

[social]
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = ["tiktok", "instagram"]
upload_post_auto_upload = false

[affiliate]
tiki_affiliate_id = ""
shopee_affiliate_id = ""
amazon_associate_tag = ""

[ui]
language = "vi"  # vi, en
hide_log = false
