# BookAI Configuration
# Copy to config.toml and fill in your API keys

[app]
project_name = "BookAI"
version = "0.2.0"
listen_host = "0.0.0.0"
listen_port = 8080
log_level = "INFO"
output_dir = "output"
max_concurrent_tasks = 5
max_queued_tasks = 100
enable_redis = false
redis_host = "localhost"
redis_port = 6379

[llm]
provider = "openai"  # openai, anthropic, gemini, deepseek, ollama, groq, litellm
openai_api_key = ""
openai_model_name = "gpt-4o-mini"
temperature = 0.7
max_tokens = 4096

[tts]
provider = "edge_tts"  # edge_tts, azure, siliconflow, elevenlabs, no_voice
voice = "vi-VN-HoaiMyNeural"
rate = "+0%"
azure_speech_key = ""
azure_speech_region = ""

[video]
aspect = "9:16"  # 9:16, 16:9, 1:1
transition = "fade_in"
bgm_mode = "random"  # none, random, specific
subtitle_enabled = true
video_source = "pexels"
pexels_api_keys = []
pixabay_api_keys = []

[social]
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = ["tiktok", "instagram"]
upload_post_auto_upload = false

[affiliate]
tiki_affiliate_id = ""
shopee_affiliate_id = ""
amazon_associate_tag = ""

[ui]
language = "vi"  # vi, en
hide_log = false
